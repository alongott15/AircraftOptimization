[project]
name = "aircraft-opt"
version = "0.1.0"
description = "Fleet Usability Optimizer — compliance engine, ML scoring and CP-SAT aircraft selection (POC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "ortools>=9.11",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "joblib>=1.4",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "structlog>=24.4",
    "alembic>=1.20.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
vertica = ["vertica-python>=1.4"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF", "S", "PT", "DTZ", "TID", "ARG", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "S101", "RUF001", "RUF002", "RUF003", "PLC0415", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PLR", "DTZ001", "PT018", "PT012", "E501", "N802"]
"app/seed/**" = ["S311"]
"app/db/migrations/versions/**" = ["E501", "W291"]
"app/datasources/vertica.py" = ["ARG002"]
"app/db/orm.py" = ["ARG002"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not perf'"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`:DeprecationWarning"]
markers = ["perf: performance tests (deselect with -m 'not perf')"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.api", "app.services", "app.repositories", "app.db", "app.datasources", "app.ml",
    "fastapi", "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "Compliance is upstream of optimization"
type = "forbidden"
source_modules = ["app.domain.compliance"]
forbidden_modules = ["app.domain.optimization"]

[[tool.importlinter.contracts]]
name = "Compliance does not depend on maintenance planning"
type = "forbidden"
source_modules = ["app.domain.compliance"]
forbidden_modules = ["app.domain.maintenance"]

[[tool.importlinter.contracts]]
name = "API does not touch the DB directly"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.repositories", "app.db"]
allow_indirect_imports = true
